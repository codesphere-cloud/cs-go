name: Publish CLI reference to Codesphere Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'CS CLI release tag to publish (for example v1.55.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CS_VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: publish-cli-docs
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CS CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CS_VERSION }}
          path: cs-go
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cs-go/go.mod
          cache-dependency-path: cs-go/go.sum

      - name: Generate CLI reference
        working-directory: cs-go
        run: make docs-docusaurus DOCS_VERSION="$CS_VERSION"

      - name: Checkout Codesphere Docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codesphere-cloud/codesphere-docs
          ref: main
          path: codesphere-docs
          token: ${{ secrets.CODESPHERE_DOCS_TOKEN || secrets.PAT_UPDATE_DOCS }}

      - name: Prepare Docusaurus command pages
        run: bash cs-go/hack/sync-cli-docs.sh cs-go/docs-docusaurus codesphere-docs

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: codesphere-docs/package-lock.json

      - name: Verify docs render
        working-directory: codesphere-docs
        run: |
          npm ci
          npm run build -- --locale en

      - name: Create or update docs PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: codesphere-docs
          token: ${{ secrets.CODESPHERE_DOCS_TOKEN || secrets.PAT_UPDATE_DOCS }}
          branch: automation/cs-cli-reference
          base: main
          add-paths: |
            docs/APIs_and_Automations/cs-cli/
            docs/APIs_and_Automations/cli-command-reference.mdx
          commit-message: 'docs: sync CS CLI reference for ${{ env.CS_VERSION }}'
          signoff: true
          title: 'docs: update CS CLI reference for ${{ env.CS_VERSION }}'
          body: |
            Update the CS CLI reference generated from [CS CLI ${{ env.CS_VERSION }}](https://github.com/codesphere-cloud/cs-go/releases/tag/${{ env.CS_VERSION }}).

            Command pages preserve relative navigation and use Docusaurus CommonMark parsing for CLI syntax. Obsolete command pages are removed; the workflow examples guide links to the published reference.

            Validation: English Docusaurus production build passed.
